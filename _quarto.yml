project:
   type: website

var:
  url-repo: https://github.com/iic-jku/design-complex-ic   # to call this value : {{< meta var.url-repo >}}

website:
  title: "Design of Complex Integrated Circuits"
  favicon: favicon.png
  navbar:
    background: "#447099"
    search: true
    left:
      - icon: house
        href: index.qmd
        text: "About"
      - href: dcic.qmd
        text: "Course Material"
    right:
      - icon: github
        href: "{{< meta var.url-repo >}}"
        target: "_blank"

  page-footer:
    right: |
      Website built with [Quarto](https://quarto.org/){.external target="_blank"}
    left: |
      [Source code]({{< meta var.url-repo >}}){.external target="_blank"}
execute:
  freeze: auto

format:
  html:
    theme:
      light: cosmo
      dark: solar
    fig-align: center
    lang: en-US
    lightbox: true
